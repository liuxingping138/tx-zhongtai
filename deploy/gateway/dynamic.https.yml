# HTTPS 动态路由。路径与 dynamic.yml 相同，入口改为 websecure。
# 证书挂在文件 Provider 上，不使用 Docker Provider，也不依赖容器 labels。

tls:
  # IP 访问通常不发送 SNI，因此必须配置默认服务器证书。
  stores:
    default:
      defaultCertificate:
        certFile: /certs/fullchain.pem
        keyFile: /certs/privkey.pem
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/privkey.pem
  options:
    default:
      minVersion: VersionTLS12

http:
  routers:
    iam-auth:
      rule: "PathPrefix(`/api/v1/auth`)"
      entryPoints: ["websecure"]
      service: iam-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    iam-system:
      rule: "PathPrefix(`/api/v1/system`)"
      entryPoints: ["websecure"]
      service: iam-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    audit:
      rule: "PathPrefix(`/api/v1/audit`)"
      entryPoints: ["websecure"]
      service: audit-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    codebook:
      rule: "PathPrefix(`/api/v1/codebook`)"
      entryPoints: ["websecure"]
      service: codebook-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    policy:
      rule: "PathPrefix(`/api/v1/policy`)"
      entryPoints: ["websecure"]
      service: policy-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    tender:
      rule: "PathPrefix(`/api/v1/tender`)"
      entryPoints: ["websecure"]
      service: tender-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    ai:
      rule: "PathPrefix(`/api/v1/ai`)"
      entryPoints: ["websecure"]
      service: ai-service
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 100
      tls: {}
    thinktank:
      rule: "PathPrefix(`/api/v1/thinktank`)"
      entryPoints: ["websecure"]
      service: thinktank-service
      middlewares: ["secure-headers", "compress", "thinktank-limit"]
      priority: 100
      tls: {}
    # 流式回答：不挂压缩和请求缓冲（buffering 会把整个响应攒满才下发），请求体上限由服务自己限制。
    ai-stream:
      rule: "PathPrefix(`/api/v1/ai/stream`)"
      entryPoints: ["websecure"]
      service: ai-service
      middlewares: ["secure-headers"]
      priority: 110
      tls: {}
    api-fallback:
      rule: "PathPrefix(`/api/v1`)"
      entryPoints: ["websecure"]
      service: api-fallback
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 50
      tls: {}
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints: ["websecure"]
      service: frontend
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 1
      tls: {}

  middlewares:
    # 浏览器侧的加固：一年内只走 HTTPS、不猜内容类型、不许被别的站 iframe 进去。
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
    compress:
      compress:
        excludedContentTypes:
          - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          - "application/zip"
          - "image/webp"
          - "image/png"
          - "image/jpeg"
    request-limit:
      buffering:
        maxRequestBodyBytes: 21233664
    thinktank-limit:
      buffering:
        maxRequestBodyBytes: 52690944

  services:
    iam-service:
      loadBalancer:
        servers:
          - url: "http://iam-service:8001"
    audit-service:
      loadBalancer:
        servers:
          - url: "http://audit-service:8002"
    codebook-service:
      loadBalancer:
        servers:
          - url: "http://codebook-service:8003"
    policy-service:
      loadBalancer:
        servers:
          - url: "http://policy-service:8004"
    tender-service:
      loadBalancer:
        servers:
          - url: "http://tender-service:8006"
    ai-service:
      loadBalancer:
        servers:
          - url: "http://ai-service:8005"
    thinktank-service:
      loadBalancer:
        servers:
          - url: "http://thinktank-service:8007"
    api-fallback:
      loadBalancer:
        servers:
          - url: "http://api-fallback:80"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
