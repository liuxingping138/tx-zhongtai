# 用于 api-fallback 容器：对所有落到这里的请求统一返回 404 JSON，
# 避免未接入的业务前缀（/api/v1/policy、/api/v1/customer 等）被网关误路由到前端 SPA
# 导致返回 200 的 HTML 页面。真实的服务上线后应在 docker-compose.yml 中
# 为其单独定义更高优先级的 Traefik 路由，此兜底路由的匹配优先级最低。
server {
    listen 80 default_server;
    server_name _;

    location / {
        default_type application/json;
        return 404 '{"code":"RESOURCE_NOT_FOUND","message":"接口不存在","data":null,"request_id":null}';
    }
}
