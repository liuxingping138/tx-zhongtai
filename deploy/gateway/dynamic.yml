# Traefik 动态路由配置（文件 Provider）。
# 优先级设计：具体业务前缀（100）> 未接入业务的 /api/v1 兜底 404（50）> 前端 SPA 兜底（1）。
# 这样 /api/v1/customer 等尚未接入的业务前缀会被 api-fallback 拦截返回 404，
# 不会被前端的 PathPrefix(`/`) 兜底路由捕获而误返回 200 的 HTML。
#
# `/health/*`、`/internal/*` 均未在此声明路由，网关不会公开这些内部路径。

http:
  routers:
    iam-auth:
      rule: "PathPrefix(`/api/v1/auth`)"
      entryPoints: ["web"]
      service: iam-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    iam-system:
      rule: "PathPrefix(`/api/v1/system`)"
      entryPoints: ["web"]
      service: iam-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    audit:
      rule: "PathPrefix(`/api/v1/audit`)"
      entryPoints: ["web"]
      service: audit-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    codebook:
      rule: "PathPrefix(`/api/v1/codebook`)"
      entryPoints: ["web"]
      service: codebook-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    policy:
      rule: "PathPrefix(`/api/v1/policy`)"
      entryPoints: ["web"]
      service: policy-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    tender:
      rule: "PathPrefix(`/api/v1/tender`)"
      entryPoints: ["web"]
      service: tender-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    ai:
      rule: "PathPrefix(`/api/v1/ai`)"
      entryPoints: ["web"]
      service: ai-service
      middlewares: ["compress", "request-limit"]
      priority: 100
    thinktank:
      rule: "PathPrefix(`/api/v1/thinktank`)"
      entryPoints: ["web"]
      service: thinktank-service
      middlewares: ["compress", "thinktank-limit"]
      priority: 100
    # 流式回答：不挂压缩和请求缓冲（buffering 会把整个响应攒满才下发），请求体上限由服务自己限制。
    ai-stream:
      rule: "PathPrefix(`/api/v1/ai/stream`)"
      entryPoints: ["web"]
      service: ai-service
      priority: 110
    ai-download:
      rule: "PathRegexp(`^/api/v1/ai/batch-runs/[^/]+/files/[^/]+$`)"
      entryPoints: ["web"]
      service: ai-service
      priority: 110
    thinktank-download:
      rule: "PathRegexp(`^/api/v1/thinktank/knowledge/[^/]+/(content|download)$`)"
      entryPoints: ["web"]
      service: thinktank-service
      priority: 110
    api-fallback:
      rule: "PathPrefix(`/api/v1`)"
      entryPoints: ["web"]
      service: api-fallback
      middlewares: ["compress", "request-limit"]
      priority: 50
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints: ["web"]
      service: frontend
      middlewares: ["secure-headers", "compress", "request-limit"]
      priority: 1

  middlewares:
    # 非 HTTPS 基线安全头（不含 HSTS，避免局域网 HTTP 调试被浏览器锁死 HTTPS）。
    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        # 'wasm-unsafe-eval' 只放行编译 WebAssembly（不放行 eval）：PDF.js 在 worker 里用 wasm 解码扫描件常见的
        # JBIG2 / JPEG 2000 图片和 ICC 颜色；worker 脚本也经这个中间件拿到同一份 CSP，不放行就退回慢的 JS 解码。
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
    # JSON 和前端资源都是高压缩比文本：筛选项接口未压缩时约 940KB，
    # 前端主包约 1.1MB。Traefik 默认只压缩超过 1KB 的响应，小响应不受影响。
    compress:
      compress:
        # xlsx 本身就是 zip，再压几乎没有收益，只是白白消耗两端 CPU。
        excludedContentTypes:
          - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          - "application/zip"
          - "image/webp"
          - "image/png"
          - "image/jpeg"
    # 20MB 导入上限再加 256KB multipart 边距。超过的请求在网关被拒绝，不会进到服务。
    request-limit:
      buffering:
        maxRequestBodyBytes: 21233664
    # 智库知识文件上传上限 50MB 再加 256KB multipart 边距。
    thinktank-limit:
      buffering:
        maxRequestBodyBytes: 52690944

  services:
    iam-service:
      loadBalancer:
        servers:
          - url: "http://iam-service:8001"
    audit-service:
      loadBalancer:
        servers:
          - url: "http://audit-service:8002"
    codebook-service:
      loadBalancer:
        servers:
          - url: "http://codebook-service:8003"
    policy-service:
      loadBalancer:
        servers:
          - url: "http://policy-service:8004"
    tender-service:
      loadBalancer:
        servers:
          - url: "http://tender-service:8006"
    ai-service:
      loadBalancer:
        servers:
          - url: "http://ai-service:8005"
    thinktank-service:
      loadBalancer:
        servers:
          - url: "http://thinktank-service:8007"
    api-fallback:
      loadBalancer:
        servers:
          - url: "http://api-fallback:80"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
