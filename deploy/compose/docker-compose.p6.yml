# 覆盖主 Compose，形成隔离验收栈。不得与开发卷、网络同名。
# 内部密钥在此写成 YAML 字面量，避免本机 .env 插值与 ${VAR:-{...}} 截断。
name: tx-zhongtai-p6

networks:
  gateway:
    name: tx-zhongtai-p6-gateway
  data:
    name: tx-zhongtai-p6-data
    internal: true

volumes:
  postgres-data:
    name: tx-zhongtai-p6-postgres-data
  redis-data:
    name: tx-zhongtai-p6-redis-data
  ai-data:
    name: tx-zhongtai-p6-ai-data

services:
  iam-service:
    volumes:
      - ../secrets/jwt-p6:/secrets/jwt
    environment:
      IAM_ENVIRONMENT: test
      IAM_REFRESH_REUSE_GRACE_SECONDS: "0"
      IAM_CSRF_ALLOWED_ORIGINS: '["http://localhost:8090","http://127.0.0.1:8090"]'
      IAM_INTERNAL_CALLER_SECRETS: '{"audit-service":"p6-only-change-me-internal","codebook-service":"p6-only-change-me-internal","policy-service":"p6-only-change-me-internal","ai-service":"p6-only-change-me-internal"}'
      IAM_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
  iam-worker:
    volumes:
      - ../secrets/jwt-p6:/secrets/jwt
    environment:
      IAM_ENVIRONMENT: test
      IAM_INTERNAL_CALLER_SECRETS: '{"audit-service":"p6-only-change-me-internal","codebook-service":"p6-only-change-me-internal","policy-service":"p6-only-change-me-internal","ai-service":"p6-only-change-me-internal"}'
      IAM_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
  audit-service:
    environment:
      AUDIT_ENVIRONMENT: test
      AUDIT_INTERNAL_CALLER_SECRETS: '{"iam-service":"p6-only-change-me-ingest","codebook-service":"p6-only-change-me-ingest","policy-service":"p6-only-change-me-ingest","ai-service":"p6-only-change-me-ingest"}'
      AUDIT_IAM_SERVICE_SECRET: p6-only-change-me-internal
  audit-worker:
    environment:
      AUDIT_ENVIRONMENT: test
  codebook-service:
    environment:
      CODEBOOK_ENVIRONMENT: test
      CODEBOOK_IAM_SERVICE_SECRET: p6-only-change-me-internal
      CODEBOOK_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
  policy-service:
    environment:
      POLICY_ENVIRONMENT: test
      POLICY_IAM_SERVICE_SECRET: p6-only-change-me-internal
      POLICY_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
  policy-worker:
    environment:
      POLICY_ENVIRONMENT: test
      POLICY_IAM_SERVICE_SECRET: p6-only-change-me-internal
      POLICY_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
      POLICY_CRAWLER_MYSQL_HOST: ""
      POLICY_CRAWLER_MYSQL_USER: ""
      POLICY_CRAWLER_MYSQL_PASSWORD: ""
  # 模型调用全部改发到 llm-mock（模拟模型服务），密钥是占位值：验收能跑通试发、样本试跑和批量任务，不会调用真实大模型。
  ai-service:
    environment:
      AI_ENVIRONMENT: test
      AI_IAM_SERVICE_SECRET: p6-only-change-me-internal
      AI_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
      AI_ARK_API_KEY: p6-mock
      AI_BAIDU_API_KEY: p6-mock
      AI_LLM_BASE_URL: http://llm-mock:8099
    depends_on:
      llm-mock:
        condition: service_started
  ai-worker:
    environment:
      AI_ENVIRONMENT: test
      AI_IAM_SERVICE_SECRET: p6-only-change-me-internal
      AI_AUDIT_INGEST_SECRET: p6-only-change-me-ingest
      AI_ARK_API_KEY: p6-mock
      AI_BAIDU_API_KEY: p6-mock
      AI_LLM_BASE_URL: http://llm-mock:8099
      # 每行之间别太快跑完，e2e 才看得到「运行中」和停止。
      AI_BATCH_CONCURRENCY: "2"
    depends_on:
      llm-mock:
        condition: service_started
  llm-mock:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    command: [".venv/bin/python", "/mock/llm_mock.py"]
    volumes:
      - ./p6/llm_mock.py:/mock/llm_mock.py:ro
    networks:
      - data
