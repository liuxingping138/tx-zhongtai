# 本地开发环境 Compose。生产部署需另行准备（本期不执行）。
# 运行单元：frontend、gateway、iam-service、iam-worker、audit-service、codebook-service、policy-service、policy-worker、
# ai-service、ai-worker、postgres、redis。
#
# 使用方式：在仓库根目录执行 `docker compose -f deploy/compose/docker-compose.yml --env-file .env up`
# 或通过根目录 Makefile 的 `make dev-up` / `make dev-down`。

name: tx-zhongtai

networks:
  gateway:
    name: tx-zhongtai-gateway
  data:
    name: tx-zhongtai-data
    internal: true

volumes:
  postgres-data:
  redis-data:
  # AI提问的模板 Excel、码表和批量结果
  ai-data:
  # 智库本地兜底存储目录（接入 MinIO 时可作缓存/临时目录）
  thinktank-data:

# 应用容器都设内存上限（mem_limit，可用同名环境变量调）：和同机其他业务共用 15G，
# 不设的话 ai-worker 跑大任务涨上去，宿主机的 OOM killer 可能先杀 Postgres 或别人的服务，而不是出问题的这个容器。
services:
  postgres:
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    # 默认 64MB 的共享内存，并行查询、大排序时会报 could not resize shared memory。
    # 默认 max_connections=100 不够多服务连接池峰值，显式提升到 200。
    shm_size: 256m
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD 未设置}
      IAM_DB_NAME: ${IAM_DB_NAME:?IAM_DB_NAME 未设置}
      IAM_DB_USER: ${IAM_DB_USER:?IAM_DB_USER 未设置}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD 未设置}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:?AUDIT_DB_NAME 未设置}
      AUDIT_DB_USER: ${AUDIT_DB_USER:?AUDIT_DB_USER 未设置}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD 未设置}
      AUDIT_CLEANUP_DB_USER: ${AUDIT_CLEANUP_DB_USER:-audit_cleanup}
      AUDIT_CLEANUP_DB_PASSWORD: ${AUDIT_CLEANUP_DB_PASSWORD:?AUDIT_CLEANUP_DB_PASSWORD 未设置}
      CODEBOOK_DB_NAME: ${CODEBOOK_DB_NAME:?CODEBOOK_DB_NAME 未设置}
      CODEBOOK_DB_USER: ${CODEBOOK_DB_USER:?CODEBOOK_DB_USER 未设置}
      CODEBOOK_DB_PASSWORD: ${CODEBOOK_DB_PASSWORD:?CODEBOOK_DB_PASSWORD 未设置}
      POLICY_DB_NAME: ${POLICY_DB_NAME:?POLICY_DB_NAME 未设置}
      POLICY_DB_USER: ${POLICY_DB_USER:?POLICY_DB_USER 未设置}
      POLICY_DB_PASSWORD: ${POLICY_DB_PASSWORD:?POLICY_DB_PASSWORD 未设置}
      AI_DB_NAME: ${AI_DB_NAME:?AI_DB_NAME 未设置}
      AI_DB_USER: ${AI_DB_USER:?AI_DB_USER 未设置}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD 未设置}
      THINKTANK_DB_NAME: ${THINKTANK_DB_NAME:-thinktank_db}
      THINKTANK_DB_USER: ${THINKTANK_DB_USER:-thinktank_app}
      THINKTANK_DB_PASSWORD: ${THINKTANK_DB_PASSWORD:?THINKTANK_DB_PASSWORD 未设置}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    # 默认只绑本机。当前开发机需要 Navicat 从公网连接时，在 .env 设 POSTGRES_BIND_ADDR=0.0.0.0。
    # 宿主机端口可通过 .env 的 POSTGRES_HOST_PORT 调整，避免与本机已运行的 PostgreSQL 冲突。
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data
    networks:
      - data
    # 不映射宿主机端口。登录限流只走 Docker 网络，映射出去只会扩大暴露面。
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  iam-service:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${IAM_MEM_LIMIT:-1g}
    environment:
      IAM_ENVIRONMENT: ${IAM_ENVIRONMENT:-${ENVIRONMENT:-development}}
      IAM_SERVICE_NAME: iam-service
      IAM_LOG_LEVEL: ${IAM_LOG_LEVEL:-INFO}
      IAM_DATABASE_URL: postgresql+asyncpg://${IAM_DB_USER}:${IAM_DB_PASSWORD}@postgres:5432/${IAM_DB_NAME}
      IAM_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}@redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      IAM_CORS_ALLOW_ORIGINS: ${IAM_CORS_ALLOW_ORIGINS:-[]}
      IAM_JWT_KEYS_DIR: /secrets/jwt
      IAM_COOKIE_SECURE: ${IAM_COOKIE_SECURE:-false}
      IAM_ACCESS_TOKEN_TTL_SECONDS: ${IAM_ACCESS_TOKEN_TTL_SECONDS:-28800}
      IAM_REFRESH_REUSE_GRACE_SECONDS: ${IAM_REFRESH_REUSE_GRACE_SECONDS:-30}
      IAM_LOGIN_MAX_FAILURES: ${IAM_LOGIN_MAX_FAILURES:-5}
      IAM_LOGIN_MAX_FAILURES_PER_IP: ${IAM_LOGIN_MAX_FAILURES_PER_IP:-20}
      IAM_LOGIN_LOCKOUT_SECONDS: ${IAM_LOGIN_LOCKOUT_SECONDS:-300}
      IAM_SESSION_RETENTION_DAYS: ${IAM_SESSION_RETENTION_DAYS:-30}
      IAM_WORKER_LEASE_SECONDS: ${IAM_WORKER_LEASE_SECONDS:-30}
      IAM_CSRF_ALLOWED_ORIGINS: '${IAM_CSRF_ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]}'
      IAM_INTERNAL_CALLER_SECRETS: ${IAM_INTERNAL_CALLER_SECRETS}
      IAM_AUDIT_INGEST_URL: http://audit-service:8002
      IAM_AUDIT_INGEST_SECRET: ${IAM_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
    volumes:
      - ../../deploy/secrets/jwt:/secrets/jwt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${AUDIT_MEM_LIMIT:-512m}
    environment:
      AUDIT_ENVIRONMENT: ${AUDIT_ENVIRONMENT:-${ENVIRONMENT:-development}}
      AUDIT_SERVICE_NAME: audit-service
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL:-INFO}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_DB_USER}:${AUDIT_DB_PASSWORD}@postgres:5432/${AUDIT_DB_NAME}
      AUDIT_CORS_ALLOW_ORIGINS: ${AUDIT_CORS_ALLOW_ORIGINS:-[]}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      AUDIT_INTERNAL_CALLER_SECRETS: ${AUDIT_INTERNAL_CALLER_SECRETS}
      AUDIT_IAM_BASE_URL: http://iam-service:8001
      AUDIT_IAM_SERVICE_SECRET: ${AUDIT_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      AUDIT_CLEANUP_DB_USER: ${AUDIT_CLEANUP_DB_USER:-audit_cleanup}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  codebook-service:
    build:
      context: ../..
      dockerfile: services/codebook-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${CODEBOOK_MEM_LIMIT:-1g}
    environment:
      CODEBOOK_ENVIRONMENT: ${CODEBOOK_ENVIRONMENT:-${ENVIRONMENT:-development}}
      CODEBOOK_IMPORT_MAX_BYTES: ${CODEBOOK_IMPORT_MAX_BYTES:-20971520}
      CODEBOOK_EXPORT_MAX_ROWS: ${CODEBOOK_EXPORT_MAX_ROWS:-100000}
      CODEBOOK_SERVICE_NAME: codebook-service
      CODEBOOK_LOG_LEVEL: ${CODEBOOK_LOG_LEVEL:-INFO}
      CODEBOOK_DATABASE_URL: postgresql+asyncpg://${CODEBOOK_DB_USER}:${CODEBOOK_DB_PASSWORD}@postgres:5432/${CODEBOOK_DB_NAME}
      CODEBOOK_CORS_ALLOW_ORIGINS: ${CODEBOOK_CORS_ALLOW_ORIGINS:-[]}
      CODEBOOK_IAM_BASE_URL: http://iam-service:8001
      CODEBOOK_IAM_SERVICE_SECRET: ${CODEBOOK_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      CODEBOOK_AUDIT_INGEST_URL: http://audit-service:8002
      CODEBOOK_AUDIT_INGEST_SECRET: ${CODEBOOK_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      # 内部接口的调用方：AI 模板取系统码表、政策 AI 打标取码表、智库取省市区码表。每个密钥都是同一个变量传给调用方，两边不会配岔。
      CODEBOOK_INTERNAL_CALLER_SECRETS: '{"ai-service":"${CODEBOOK_AI_CALLER_SECRET:-dev-only-change-me-internal}","policy-service":"${CODEBOOK_POLICY_CALLER_SECRET:-dev-only-change-me-internal}","thinktank-service":"${CODEBOOK_THINKTANK_CALLER_SECRET:-dev-only-change-me-internal}"}'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8003/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  policy-service:
    build:
      context: ../..
      dockerfile: services/policy-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${POLICY_MEM_LIMIT:-2g}
    environment:
      POLICY_ENVIRONMENT: ${POLICY_ENVIRONMENT:-${ENVIRONMENT:-development}}
      POLICY_SERVICE_NAME: policy-service
      POLICY_IMPORT_MAX_BYTES: ${POLICY_IMPORT_MAX_BYTES:-20971520}
      POLICY_EXPORT_MAX_ROWS: ${POLICY_EXPORT_MAX_ROWS:-100000}
      POLICY_EXPORT_CONTENT_MAX_ROWS: ${POLICY_EXPORT_CONTENT_MAX_ROWS:-20000}
      POLICY_CRAWLER_HEALTH_NORMAL_DAYS: ${POLICY_CRAWLER_HEALTH_NORMAL_DAYS:-7}
      POLICY_CRAWLER_HEALTH_WATCH_DAYS: ${POLICY_CRAWLER_HEALTH_WATCH_DAYS:-30}
      POLICY_LOG_LEVEL: ${POLICY_LOG_LEVEL:-INFO}
      POLICY_DATABASE_URL: postgresql+asyncpg://${POLICY_DB_USER}:${POLICY_DB_PASSWORD}@postgres:5432/${POLICY_DB_NAME}
      POLICY_CORS_ALLOW_ORIGINS: ${POLICY_CORS_ALLOW_ORIGINS:-[]}
      POLICY_IAM_BASE_URL: http://iam-service:8001
      POLICY_IAM_SERVICE_SECRET: ${POLICY_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      POLICY_AUDIT_INGEST_URL: http://audit-service:8002
      POLICY_AUDIT_INGEST_SECRET: ${POLICY_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      POLICY_AI_SERVICE_SECRET: ${AI_POLICY_CALLER_SECRET:-dev-only-change-me-internal}
      POLICY_CODEBOOK_SERVICE_SECRET: ${CODEBOOK_POLICY_CALLER_SECRET:-dev-only-change-me-internal}
      POLICY_CRAWLER_MYSQL_HOST: ${POLICY_CRAWLER_MYSQL_HOST:-}
      POLICY_CRAWLER_MYSQL_PORT: ${POLICY_CRAWLER_MYSQL_PORT:-3306}
      POLICY_CRAWLER_MYSQL_USER: ${POLICY_CRAWLER_MYSQL_USER:-}
      POLICY_CRAWLER_MYSQL_PASSWORD: ${POLICY_CRAWLER_MYSQL_PASSWORD:-}
      POLICY_CRAWLER_MYSQL_DB: ${POLICY_CRAWLER_MYSQL_DB:-crawler2021}
      POLICY_POLICY_SOURCE_DB: ${POLICY_POLICY_SOURCE_DB:-bid_analyse}
      POLICY_CRAWLER_CONFIG_EXPAND_FROM: ${POLICY_CRAWLER_CONFIG_EXPAND_FROM:-2026-10-26}
      POLICY_CRAWLER_CONFIG_BACKFILL_DATE: ${POLICY_CRAWLER_CONFIG_BACKFILL_DATE:-2026-10-22}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8004/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  policy-worker:
    build:
      context: ../..
      dockerfile: services/policy-service/Dockerfile
    command: [".venv/bin/python", "-m", "app.worker"]
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: ${POLICY_WORKER_MEM_LIMIT:-2g}
    environment:
      POLICY_ENVIRONMENT: ${POLICY_ENVIRONMENT:-${ENVIRONMENT:-development}}
      POLICY_SERVICE_NAME: policy-worker
      # worker 跑的是几分钟到几小时的同步、打标和投递：语句和空闲事务超时只给对外接口的进程，这里关掉（0 = 不限）。
      DB_STATEMENT_TIMEOUT_MS: "0"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      POLICY_IMPORT_MAX_BYTES: ${POLICY_IMPORT_MAX_BYTES:-20971520}
      POLICY_EXPORT_MAX_ROWS: ${POLICY_EXPORT_MAX_ROWS:-100000}
      POLICY_CRAWLER_HEALTH_NORMAL_DAYS: ${POLICY_CRAWLER_HEALTH_NORMAL_DAYS:-7}
      POLICY_CRAWLER_HEALTH_WATCH_DAYS: ${POLICY_CRAWLER_HEALTH_WATCH_DAYS:-30}
      POLICY_LOG_LEVEL: ${POLICY_LOG_LEVEL:-INFO}
      POLICY_DATABASE_URL: postgresql+asyncpg://${POLICY_DB_USER}:${POLICY_DB_PASSWORD}@postgres:5432/${POLICY_DB_NAME}
      POLICY_CORS_ALLOW_ORIGINS: ${POLICY_CORS_ALLOW_ORIGINS:-[]}
      POLICY_IAM_BASE_URL: http://iam-service:8001
      POLICY_IAM_SERVICE_SECRET: ${POLICY_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      POLICY_AUDIT_INGEST_URL: http://audit-service:8002
      POLICY_AUDIT_INGEST_SECRET: ${POLICY_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      POLICY_AI_SERVICE_SECRET: ${AI_POLICY_CALLER_SECRET:-dev-only-change-me-internal}
      POLICY_CODEBOOK_SERVICE_SECRET: ${CODEBOOK_POLICY_CALLER_SECRET:-dev-only-change-me-internal}
      POLICY_CRAWLER_MYSQL_HOST: ${POLICY_CRAWLER_MYSQL_HOST:-}
      POLICY_CRAWLER_MYSQL_PORT: ${POLICY_CRAWLER_MYSQL_PORT:-3306}
      POLICY_CRAWLER_MYSQL_USER: ${POLICY_CRAWLER_MYSQL_USER:-}
      POLICY_CRAWLER_MYSQL_PASSWORD: ${POLICY_CRAWLER_MYSQL_PASSWORD:-}
      POLICY_CRAWLER_MYSQL_DB: ${POLICY_CRAWLER_MYSQL_DB:-crawler2021}
      POLICY_POLICY_SOURCE_DB: ${POLICY_POLICY_SOURCE_DB:-bid_analyse}
      POLICY_CRAWLER_CONFIG_EXPAND_FROM: ${POLICY_CRAWLER_CONFIG_EXPAND_FROM:-2026-10-26}
      POLICY_CRAWLER_CONFIG_BACKFILL_DATE: ${POLICY_CRAWLER_CONFIG_BACKFILL_DATE:-2026-10-22}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway  # 外部 MySQL 数据源需要出站网络；不发布任何端口
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-m", "app.worker.health"]
      interval: 10s
      timeout: 5s
      retries: 5

  tender-service:
    build:
      context: ../..
      dockerfile: services/tender-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${TENDER_MEM_LIMIT:-1g}
    environment:
      TENDER_ENVIRONMENT: ${TENDER_ENVIRONMENT:-${ENVIRONMENT:-development}}
      TENDER_LOG_LEVEL: ${TENDER_LOG_LEVEL:-INFO}
      TENDER_IAM_BASE_URL: http://iam-service:8001
      TENDER_IAM_SERVICE_SECRET: ${TENDER_IAM_SERVICE_SECRET:-}
      TENDER_AUDIT_INGEST_URL: http://audit-service:8002
      TENDER_AUDIT_INGEST_SECRET: ${TENDER_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      TENDER_MYSQL_HOST: ${TENDER_MYSQL_HOST:-}
      TENDER_MYSQL_PORT: ${TENDER_MYSQL_PORT:-3306}
      TENDER_MYSQL_USER: ${TENDER_MYSQL_USER:-}
      TENDER_MYSQL_PASSWORD: ${TENDER_MYSQL_PASSWORD:-}
      TENDER_MYSQL_READ_TIMEOUT: ${TENDER_MYSQL_READ_TIMEOUT:-20}
      TENDER_MYSQL_COUNT_TIMEOUT: ${TENDER_MYSQL_COUNT_TIMEOUT:-120}
      TENDER_STATS_CACHE_SECONDS: ${TENDER_STATS_CACHE_SECONDS:-300}
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8006/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    mem_limit: ${AI_MEM_LIMIT:-2g}
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-${ENVIRONMENT:-development}}
      AI_SERVICE_NAME: ai-service
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_DATABASE_URL: postgresql+asyncpg://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres:5432/${AI_DB_NAME}
      AI_CORS_ALLOW_ORIGINS: ${AI_CORS_ALLOW_ORIGINS:-[]}
      AI_IAM_BASE_URL: http://iam-service:8001
      AI_IAM_SERVICE_SECRET: ${AI_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      AI_AUDIT_INGEST_URL: http://audit-service:8002
      AI_AUDIT_INGEST_SECRET: ${AI_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      AI_CODEBOOK_BASE_URL: http://codebook-service:8003
      AI_CODEBOOK_SERVICE_SECRET: ${CODEBOOK_AI_CALLER_SECRET:-dev-only-change-me-internal}
      # 政策 AI 打标调 /internal/ 用上线模板跑批；和 POLICY_AI_SERVICE_SECRET 读同一个变量。
      AI_INTERNAL_CALLER_SECRETS: '{"policy-service":"${AI_POLICY_CALLER_SECRET:-dev-only-change-me-internal}"}'
      AI_UPLOAD_MAX_BYTES: ${AI_UPLOAD_MAX_BYTES:-20971520}
      AI_ARK_API_KEY: ${AI_ARK_API_KEY:-}
      AI_BAIDU_API_KEY: ${AI_BAIDU_API_KEY:-}
      AI_BATCH_CONCURRENCY: ${AI_BATCH_CONCURRENCY:-20}
      AI_BATCH_MAX_RUNNING: ${AI_BATCH_MAX_RUNNING:-3}
      AI_BATCH_STALE_SECONDS: ${AI_BATCH_STALE_SECONDS:-90}
    volumes:
      - ai-data:/data/ai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway  # 调用字节方舟、百度千帆需要出站网络
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8005/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-worker:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    command: [".venv/bin/python", "-m", "app.worker"]
    init: true
    # 停止时把在跑的批量任务收尾成「中断」并生成已完成部分的结果，要留够时间。
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: ${AI_WORKER_MEM_LIMIT:-4g}
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-${ENVIRONMENT:-development}}
      AI_SERVICE_NAME: ai-worker
      # worker 跑的是几分钟到几小时的同步、打标和投递：语句和空闲事务超时只给对外接口的进程，这里关掉（0 = 不限）。
      DB_STATEMENT_TIMEOUT_MS: "0"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_DATABASE_URL: postgresql+asyncpg://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres:5432/${AI_DB_NAME}
      AI_CORS_ALLOW_ORIGINS: ${AI_CORS_ALLOW_ORIGINS:-[]}
      AI_IAM_BASE_URL: http://iam-service:8001
      AI_IAM_SERVICE_SECRET: ${AI_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      AI_AUDIT_INGEST_URL: http://audit-service:8002
      AI_AUDIT_INGEST_SECRET: ${AI_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      AI_CODEBOOK_BASE_URL: http://codebook-service:8003
      AI_CODEBOOK_SERVICE_SECRET: ${CODEBOOK_AI_CALLER_SECRET:-dev-only-change-me-internal}
      # 政策 AI 打标调 /internal/ 用上线模板跑批；和 POLICY_AI_SERVICE_SECRET 读同一个变量。
      AI_INTERNAL_CALLER_SECRETS: '{"policy-service":"${AI_POLICY_CALLER_SECRET:-dev-only-change-me-internal}"}'
      AI_UPLOAD_MAX_BYTES: ${AI_UPLOAD_MAX_BYTES:-20971520}
      AI_ARK_API_KEY: ${AI_ARK_API_KEY:-}
      AI_BAIDU_API_KEY: ${AI_BAIDU_API_KEY:-}
      AI_BATCH_CONCURRENCY: ${AI_BATCH_CONCURRENCY:-20}
      AI_BATCH_MAX_RUNNING: ${AI_BATCH_MAX_RUNNING:-3}
      AI_BATCH_STALE_SECONDS: ${AI_BATCH_STALE_SECONDS:-90}
    volumes:
      - ai-data:/data/ai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway  # 调用大模型接口需要出站网络；不发布任何端口
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-m", "app.worker.health"]
      interval: 10s
      timeout: 5s
      retries: 5

  iam-worker:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    command: [".venv/bin/python", "-m", "app.worker"]
    init: true
    restart: unless-stopped
    mem_limit: ${IAM_WORKER_MEM_LIMIT:-512m}
    environment:
      IAM_ENVIRONMENT: ${IAM_ENVIRONMENT:-${ENVIRONMENT:-development}}
      IAM_SERVICE_NAME: iam-worker
      # worker 跑的是几分钟到几小时的同步、打标和投递：语句和空闲事务超时只给对外接口的进程，这里关掉（0 = 不限）。
      DB_STATEMENT_TIMEOUT_MS: "0"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      IAM_WORKER_LEASE_SECONDS: ${IAM_WORKER_LEASE_SECONDS:-30}
      IAM_SESSION_RETENTION_DAYS: ${IAM_SESSION_RETENTION_DAYS:-30}
      IAM_LOG_LEVEL: ${IAM_LOG_LEVEL:-INFO}
      IAM_DATABASE_URL: postgresql+asyncpg://${IAM_DB_USER}:${IAM_DB_PASSWORD}@postgres:5432/${IAM_DB_NAME}
      IAM_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}@redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      IAM_JWT_KEYS_DIR: /secrets/jwt
      IAM_INTERNAL_CALLER_SECRETS: ${IAM_INTERNAL_CALLER_SECRETS}
      IAM_AUDIT_INGEST_URL: http://audit-service:8002
      IAM_AUDIT_INGEST_SECRET: ${IAM_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
    volumes:
      - ../../deploy/secrets/jwt:/secrets/jwt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - data

  # 只跑审计服务的定时任务（每天清理到期操作日志）。清理账号的连接串只给它：对外提供接口的 audit-service
  # 拿不到，被攻破也删不了日志。
  audit-worker:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    command: [".venv/bin/python", "-m", "app.worker"]
    init: true
    restart: unless-stopped
    mem_limit: ${AUDIT_WORKER_MEM_LIMIT:-256m}
    environment:
      AUDIT_ENVIRONMENT: ${AUDIT_ENVIRONMENT:-${ENVIRONMENT:-development}}
      AUDIT_SERVICE_NAME: audit-worker
      # worker 跑的是几分钟到几小时的同步、打标和投递：语句和空闲事务超时只给对外接口的进程，这里关掉（0 = 不限）。
      DB_STATEMENT_TIMEOUT_MS: "0"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "0"
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL:-INFO}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_DB_USER}:${AUDIT_DB_PASSWORD}@postgres:5432/${AUDIT_DB_NAME}
      AUDIT_CLEANUP_DATABASE_URL: postgresql+asyncpg://${AUDIT_CLEANUP_DB_USER:-audit_cleanup}:${AUDIT_CLEANUP_DB_PASSWORD}@postgres:5432/${AUDIT_DB_NAME}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      # 和 audit-service 同一套配置：生产环境的配置检查不许内部密钥项为空。
      AUDIT_INTERNAL_CALLER_SECRETS: ${AUDIT_INTERNAL_CALLER_SECRETS}
      AUDIT_IAM_SERVICE_SECRET: ${AUDIT_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  thinktank-service:
    build:
      context: ../..
      dockerfile: services/thinktank-service/Dockerfile
    restart: unless-stopped
    # 预览转码起 LibreOffice 子进程：没有 init 时 uvicorn 当 1 号进程，被杀掉的 soffice.bin 没人回收成僵尸。
    init: true
    mem_limit: ${THINKTANK_MEM_LIMIT:-1536m}
    environment:
      THINKTANK_ENVIRONMENT: ${THINKTANK_ENVIRONMENT:-${ENVIRONMENT:-development}}
      THINKTANK_SERVICE_NAME: thinktank-service
      THINKTANK_LOG_LEVEL: ${THINKTANK_LOG_LEVEL:-INFO}
      THINKTANK_DATABASE_URL: postgresql+asyncpg://${THINKTANK_DB_USER:-thinktank_app}:${THINKTANK_DB_PASSWORD:?THINKTANK_DB_PASSWORD 未设置}@postgres:5432/${THINKTANK_DB_NAME:-thinktank_db}
      THINKTANK_CORS_ALLOW_ORIGINS: ${THINKTANK_CORS_ALLOW_ORIGINS:-[]}
      THINKTANK_IAM_BASE_URL: http://iam-service:8001
      THINKTANK_IAM_SERVICE_SECRET: ${THINKTANK_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      THINKTANK_AUDIT_INGEST_URL: http://audit-service:8002
      THINKTANK_AUDIT_INGEST_SECRET: ${THINKTANK_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
      THINKTANK_CODEBOOK_BASE_URL: http://codebook-service:8003
      THINKTANK_CODEBOOK_SERVICE_SECRET: ${CODEBOOK_THINKTANK_CALLER_SECRET:-dev-only-change-me-internal}
      THINKTANK_UPLOAD_MAX_BYTES: ${THINKTANK_UPLOAD_MAX_BYTES:-52428800}
      THINKTANK_IMPORT_MAX_BYTES: ${THINKTANK_IMPORT_MAX_BYTES:-20971520}
      THINKTANK_EXPORT_MAX_ROWS: ${THINKTANK_EXPORT_MAX_ROWS:-100000}
      THINKTANK_STORAGE_DIR: /data/thinktank
      THINKTANK_PREVIEW_CACHE_MAX_BYTES: ${THINKTANK_PREVIEW_CACHE_MAX_BYTES:-2147483648}
      THINKTANK_PREVIEW_COMPRESS_MIN_BYTES: ${THINKTANK_PREVIEW_COMPRESS_MIN_BYTES:-3145728}
      THINKTANK_PREVIEW_COMPRESS_DPI: ${THINKTANK_PREVIEW_COMPRESS_DPI:-144}
      THINKTANK_PREVIEW_OPTIMIZE_TIMEOUT_SECONDS: ${THINKTANK_PREVIEW_OPTIMIZE_TIMEOUT_SECONDS:-120}
      THINKTANK_PREVIEW_WARMUP_ON_UPLOAD: ${THINKTANK_PREVIEW_WARMUP_ON_UPLOAD:-true}
      THINKTANK_MINIO_ENDPOINT: ${THINKTANK_MINIO_ENDPOINT:-}
      THINKTANK_MINIO_ACCESS_KEY: ${THINKTANK_MINIO_ACCESS_KEY:-}
      THINKTANK_MINIO_SECRET_KEY: ${THINKTANK_MINIO_SECRET_KEY:-}
      THINKTANK_MINIO_BUCKET: ${THINKTANK_MINIO_BUCKET:-tx-bifang-knowledge-emp-service-prod}
    volumes:
      - thinktank-data:/data/thinktank
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8007/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-fallback:
    image: nginx:1.27-alpine3.20
    restart: unless-stopped
    volumes:
      - ../gateway/api-fallback.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gateway

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - gateway

  gateway:
    # 不要退回 3.2：之后修过路径匹配绕过中间件一类漏洞（CVE-2025-32431 等）。升级时先在服务器上拿生产配置空跑一次看有没有报错。
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - ../gateway:/etc/traefik:ro
    ports:
      - "${GATEWAY_BIND_ADDR:-0.0.0.0}:${GATEWAY_HTTP_PORT:-8080}:80"
    networks:
      - gateway
    depends_on:
      - iam-service
      - audit-service
      - codebook-service
      - policy-service
      - tender-service
      - ai-service
      - thinktank-service
      - frontend
      - api-fallback
