# 本地开发环境 Compose。生产部署需另行准备（本期不执行）。
# 运行单元：frontend、gateway、iam-service、iam-worker、audit-service、postgres、redis。
#
# 使用方式：在仓库根目录执行 `docker compose -f deploy/compose/docker-compose.yml --env-file .env up`
# 或通过根目录 Makefile 的 `make dev-up` / `make dev-down`。

name: tx-zhongtai

networks:
  gateway:
    name: tx-zhongtai-gateway
  data:
    name: tx-zhongtai-data
    internal: true

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD 未设置}
      IAM_DB_NAME: ${IAM_DB_NAME:?IAM_DB_NAME 未设置}
      IAM_DB_USER: ${IAM_DB_USER:?IAM_DB_USER 未设置}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD 未设置}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:?AUDIT_DB_NAME 未设置}
      AUDIT_DB_USER: ${AUDIT_DB_USER:?AUDIT_DB_USER 未设置}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD 未设置}
      AUDIT_CLEANUP_DB_USER: ${AUDIT_CLEANUP_DB_USER:-audit_cleanup}
      AUDIT_CLEANUP_DB_PASSWORD: ${AUDIT_CLEANUP_DB_PASSWORD:?AUDIT_CLEANUP_DB_PASSWORD 未设置}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    # 本地开发方便直接用客户端连接；生产不得映射数据库端口到公网。
    # 宿主机端口可通过 .env 的 POSTGRES_HOST_PORT 调整，避免与本机已运行的 PostgreSQL 冲突。
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - data
    # 宿主机端口可通过 .env 的 REDIS_HOST_PORT 调整，避免与本机已运行的 Redis 冲突。
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam-service:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    restart: unless-stopped
    environment:
      IAM_ENVIRONMENT: ${ENVIRONMENT:-development}
      IAM_SERVICE_NAME: iam-service
      IAM_LOG_LEVEL: ${IAM_LOG_LEVEL:-INFO}
      IAM_DATABASE_URL: postgresql+asyncpg://${IAM_DB_USER}:${IAM_DB_PASSWORD}@postgres:5432/${IAM_DB_NAME}
      IAM_REDIS_URL: redis://redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      IAM_CORS_ALLOW_ORIGINS: ${IAM_CORS_ALLOW_ORIGINS:-[]}
      IAM_JWT_KEYS_DIR: /secrets/jwt
      IAM_COOKIE_SECURE: "false"
      IAM_CSRF_ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173"]'
      IAM_INTERNAL_CALLER_SECRETS: ${IAM_INTERNAL_CALLER_SECRETS}
      IAM_AUDIT_INGEST_URL: http://audit-service:8002
      IAM_AUDIT_INGEST_SECRET: ${IAM_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
    volumes:
      - ../../deploy/secrets/jwt:/secrets/jwt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    restart: unless-stopped
    environment:
      AUDIT_ENVIRONMENT: ${ENVIRONMENT:-development}
      AUDIT_SERVICE_NAME: audit-service
      AUDIT_LOG_LEVEL: ${AUDIT_LOG_LEVEL:-INFO}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_DB_USER}:${AUDIT_DB_PASSWORD}@postgres:5432/${AUDIT_DB_NAME}
      AUDIT_CORS_ALLOW_ORIGINS: ${AUDIT_CORS_ALLOW_ORIGINS:-[]}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      AUDIT_INTERNAL_CALLER_SECRETS: ${AUDIT_INTERNAL_CALLER_SECRETS}
      AUDIT_IAM_BASE_URL: http://iam-service:8001
      AUDIT_IAM_SERVICE_SECRET: ${AUDIT_IAM_SERVICE_SECRET:-dev-only-change-me-internal}
      AUDIT_CLEANUP_DB_USER: ${AUDIT_CLEANUP_DB_USER:-audit_cleanup}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  iam-worker:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    command: [".venv/bin/python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      IAM_ENVIRONMENT: ${ENVIRONMENT:-development}
      IAM_SERVICE_NAME: iam-worker
      IAM_LOG_LEVEL: ${IAM_LOG_LEVEL:-INFO}
      IAM_DATABASE_URL: postgresql+asyncpg://${IAM_DB_USER}:${IAM_DB_PASSWORD}@postgres:5432/${IAM_DB_NAME}
      IAM_REDIS_URL: redis://redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      IAM_JWT_KEYS_DIR: /secrets/jwt
      IAM_INTERNAL_CALLER_SECRETS: ${IAM_INTERNAL_CALLER_SECRETS}
      IAM_AUDIT_INGEST_URL: http://audit-service:8002
      IAM_AUDIT_INGEST_SECRET: ${IAM_AUDIT_INGEST_SECRET:-dev-only-change-me-ingest}
    volumes:
      - ../../deploy/secrets/jwt:/secrets/jwt
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - data

  api-fallback:
    image: nginx:1.27-alpine3.20
    restart: unless-stopped
    volumes:
      - ../gateway/api-fallback.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gateway

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks:
      - gateway

  gateway:
    image: traefik:v3.2.3
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - ../gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    networks:
      - gateway
    depends_on:
      - iam-service
      - audit-service
      - frontend
      - api-fallback
