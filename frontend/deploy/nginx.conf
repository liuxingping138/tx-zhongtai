server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物文件名带内容哈希，可以放心长期缓存。
    location /assets/ {
        # 只用 add_header 发一条；再加 expires 会让 Cache-Control 重复两行。
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 必须每次回源校验：它引用的是带哈希的资源名，
    # 浏览器缓存了旧 HTML 就会继续加载旧包——表现为新页面路由 404、
    # 新菜单不出现，而且清不掉，只能手动强刷。不设这个头时浏览器会启发式缓存。
    # Content-Security-Policy 由 Traefik secure-headers 统一颁发，此处不重复下发。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback：仅用于前端容器内部渲染路由，不代表 API 也会 fallback 到这里。
    # 网关（Traefik）层面对 /api/v1/* 路径单独路由，未知 API 直接 404，不会进入本容器。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
