server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：仅用于前端容器内部渲染路由，不代表 API 也会 fallback 到这里。
    # 网关（Traefik）层面对 /api/v1/* 路径单独路由，未知 API 直接 404，不会进入本容器。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
