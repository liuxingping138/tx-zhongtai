[project]
name = "platform-common"
version = "0.1.0"
description = "业务数据运营平台公共基础包：统一响应、异常、请求ID、日志脱敏、鉴权客户端、Outbox 基础组件、健康检查、时钟、ORM Base、上传与下载辅助"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<0.28",
  "structlog>=24.4,<25.0",
  "PyJWT[crypto]>=2.9,<3.0",
  # orm_base 提供各服务共用的 Declarative Base
  "SQLAlchemy>=2.0,<2.1",
  # excel 模块：业务表导入导出
  "openpyxl>=3.1,<4.0",
  "anyio>=4.4,<5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_common"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入本来就写在参数默认值里，与各服务 app/api/*.py 的豁免一致。
"platform_common/service_authz.py" = ["B008"]
# 路由体检的自测要照真实路由的写法造样例，否则验不出漏挂依赖。
"tests/test_route_audit.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
]
