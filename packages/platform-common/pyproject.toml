[project]
name = "platform-common"
version = "0.1.0"
description = "业务数据运营平台公共基础包：统一响应、异常、请求ID、日志脱敏、鉴权客户端、Outbox 基础组件、健康检查、时钟、ORM Base、上传与下载辅助"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<0.28",
  "structlog>=24.4,<25.0",
  "PyJWT[crypto]>=2.9,<3.0",
  # orm_base 提供各服务共用的 Declarative Base
  "SQLAlchemy>=2.0,<2.1",
  # excel 模块：业务表导入导出
  "openpyxl>=3.1,<4.0",
  # 上传的 xlsx 是不可信 XML：坐标检查用 defusedxml，禁止实体展开和外部实体
  "defusedxml>=0.7,<0.8",
  "anyio>=4.4,<5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-defusedxml>=0.7,<0.8",
  "types-openpyxl>=3.1,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_common"]

[[tool.uv.index]]
# 锁文件按这里记录下载地址，uv sync --frozen 只认锁文件里的地址（UV_DEFAULT_INDEX 对锁定的包无效）。
# 阿里云在服务器上实测 8.6MB/s，官方 CDN 只有几十 KB/s。
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
# 规则在仓库根目录 ruff.toml，这里只写本包特有的例外。
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# FastAPI 依赖注入本来就写在参数默认值里，与各服务 app/api/*.py 的豁免一致。
"platform_common/service_authz.py" = ["B008"]
# 路由体检的自测要照真实路由的写法造样例，否则验不出漏挂依赖。
"tests/test_route_audit.py" = ["B008"]
# 存量基线（2026-10-09 登记）：结构性问题按 docs/guides/工程规范.md 第 8 节分批整改，
# 修完一条删一条；不许往这里加新条目，新代码必须直接满足规则。
"platform_common/audit_emit.py" = ["PLR0913"]
"platform_common/excel.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
]

[tool.coverage.run]
source = ["platform_common"]

[tool.coverage.report]
# 单测覆盖率下限（不含 P6 集成测试），以 2026-10-09 实测值取整为基线，只升不降；补了测试就把它调高。
# 精度 2 位：默认 0 位会把 65.89% 四舍五入成 66% 再比较，门槛就松了半个点。
precision = 2
fail_under = 71
