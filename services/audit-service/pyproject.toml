[project]
name = "audit-service"
version = "0.1.0"
description = "审计日志服务：接收审计事件、去重入库、授权查询、归档清理"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "httpx>=0.27,<0.28",
  "platform-common",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-defusedxml>=0.7,<0.8",
  "import-linter>=2.1,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<8.0",
]

[tool.uv.sources]
platform-common = { path = "../../packages/platform-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
# 锁文件按这里记录下载地址，uv sync --frozen 只认锁文件里的地址（UV_DEFAULT_INDEX 对锁定的包无效）。
# 阿里云在服务器上实测 8.6MB/s，官方 CDN 只有几十 KB/s。
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
# 规则在仓库根目录 ruff.toml，这里只写本包特有的例外。
extend = "../../ruff.toml"

[tool.importlinter]
root_package = "app"

# 分层规则见 docs/guides/工程规范.md 第 2.4 节：只能往下依赖，入口层不跳过 application 直接用仓储。
[[tool.importlinter.contracts]]
name = "分层：入口 → application → repositories → domain"
type = "layers"
layers = [
    "app.api | app.cli",
    "app.application",
    "app.repositories",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "core 是基础设施，不依赖业务层"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.application", "app.repositories"]

[[tool.importlinter.contracts]]
name = "入口层不跳过 application 直接用仓储"
type = "forbidden"
source_modules = ["app.api", "app.cli"]
forbidden_modules = ["app.repositories"]
# 只管直接导入；经 application 间接用到仓储是正常链路。
allow_indirect_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# 单测覆盖率下限（不含 P6 集成测试），只升不降；补了测试就把它调高。
# 精度 2 位：默认 0 位会把 65.89% 四舍五入成 66% 再比较，门槛就松了半个点。
precision = 2
fail_under = 87
