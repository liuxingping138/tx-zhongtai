[project]
name = "codebook-service"
version = "0.1.0"
description = "码表服务：政策类型码表、行业场景码表，支持查询、编辑、导入导出"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "httpx>=0.27,<0.28",
  "openpyxl>=3.1,<3.2",
  "python-multipart>=0.0.12,<0.0.20",
  "platform-common",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
]

[tool.uv.sources]
platform-common = { path = "../../packages/platform-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# 规则在仓库根目录 ruff.toml，这里只写本包特有的例外。
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# 建表/插入语句必须保持单行，parse_area_sql 是按行解析的，换行会改掉用例本身。
"tests/test_fields_and_excel.py" = ["E501"]
# 存量基线（2026-10-09 登记）：结构性问题按 docs/guides/工程规范.md 第 8 节分批整改，
# 修完一条删一条；不许往这里加新条目，新代码必须直接满足规则。
"app/api/security.py" = ["PLW0603"]
"app/application/area_match.py" = ["C901"]
"app/application/scenarios.py" = ["PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/versions"]
