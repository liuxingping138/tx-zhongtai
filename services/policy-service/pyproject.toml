[project]
name = "policy-service"
version = "0.1.0"
description = "政策服务：信源管理、政策基础标签表、政策解读表"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "httpx>=0.27,<0.28",
  "openpyxl>=3.1,<3.2",
  "python-multipart>=0.0.12,<0.0.20",
  # 只有爬虫同步 CLI 用，服务进程不连 MySQL。
  "pymysql>=1.1,<1.2",
  "platform-common",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "types-PyMySQL>=1.1,<1.2",
]

[tool.uv.sources]
platform-common = { path = "../../packages/platform-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# 规则在仓库根目录 ruff.toml，这里只写本包特有的例外。
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# 存量基线（2026-10-09 登记）：结构性问题按 docs/guides/工程规范.md 第 8 节分批整改，
# 修完一条删一条；不许往这里加新条目，新代码必须直接满足规则。
"app/api/security.py" = ["PLW0603"]
"app/application/base_tags.py" = ["C901", "PLR0913"]
"app/application/crawler.py" = ["PLC0415"]
"app/application/interpretations.py" = ["PLR0913"]
"app/application/sources.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"app/cli/sync_crawler.py" = ["PLR0913", "PLR0917"]
"app/cli/sync_crawler_v2.py" = ["PLR0913"]
"app/worker/scheduler.py" = ["PLC0415"]
"tests/crawler_database_acceptance.py" = ["PLR0915"]
"tests/crawler_query_benchmark.py" = ["C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/versions"]
