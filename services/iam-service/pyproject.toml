[project]
name = "iam-service"
version = "0.1.0"
description = "身份权限服务：账号、认证、会话、密码、角色、权限判定"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "redis>=5.0,<6.0",
  "argon2-cffi>=23.1,<24.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "httpx>=0.27,<0.28",
  "platform-common",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
]

[tool.uv.sources]
platform-common = { path = "../../packages/platform-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
# 迁移脚本由 alembic 按模板生成，格式沿用 alembic 官方模板，不做风格检查。
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
